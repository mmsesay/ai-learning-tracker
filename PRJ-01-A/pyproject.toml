[project]
name = "terminal-assistant"
version = "0.1.0"
description = "AI Terminal Assistant (TAM) by Maej — local CLI agent with tool calling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
terminal-assistant = "terminal_assistant.main:app"
tam = "terminal_assistant.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
